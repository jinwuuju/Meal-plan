<!DOCTYPE html>
<html lang='ko'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='theme-color' content='#f2f2f7' media='(prefers-color-scheme: light)'>
<meta name='theme-color' content='#000000' media='(prefers-color-scheme: dark)'>
<title>한 끼</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#000;--sub:rgba(60,60,67,.6);--mute:rgba(60,60,67,.3);--sep:rgba(60,60,67,.2);--fill:rgba(120,120,128,.12);--bar:rgba(249,249,249,.82);--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--xS:#ff2d55;--xE:#ff9500;--xV:#007aff;--xA:#af52de;--cF:#5856d6;--cB:#a2845e;--cL:#ffcc00;--cP:#ff6482;--cS:#00c7be;--cW:#8e8e93;--cV:#34c759}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#fff;--sub:rgba(235,235,245,.6);--mute:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);--fill:rgba(118,118,128,.24);--bar:rgba(22,22,24,.8);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--xS:#ff375f;--xE:#ff9f0a;--xV:#0a84ff;--xA:#bf5af2;--cF:#5e5ce6;--cB:#ac8e68;--cL:#ffd60a;--cS:#63e6e2;--cW:#98989d;--cV:#30d158}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,'SF Pro Text','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.02em;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.hide{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.nav{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.sc{border-bottom-color:var(--sep)}
.nav .wrap{display:flex;align-items:center;gap:12px;height:50px}
.nav .ttl{flex:1;font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.sc .ttl{opacity:1}
.nav .rt{flex:1;display:flex;justify-content:flex-end}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--blue);flex:none}
.ib svg{width:22px;height:22px}
.ib[disabled]{opacity:.3;pointer-events:none}
.tabs{display:flex;padding:2px;border-radius:9px;background:var(--fill)}
.tabs button{display:flex;align-items:center;gap:6px;padding:5px 20px;border-radius:7px;font-size:13px;font-weight:500}
.tabs button svg{display:none}
.tabs button[aria-current=page]{background:var(--card);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){.tabs button[aria-current=page]{background:#636366}}
main{padding-bottom:40px}
.lt{padding:8px 4px 14px}
.lt small{display:block;font-size:13px;font-weight:600;color:var(--sub)}
.lt h1{margin:2px 0 0;font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.03em}
.card{display:block;width:100%;background:var(--card);border-radius:18px;margin-bottom:14px;overflow:hidden;text-align:left}
.pad{padding:14px 16px}
.hero{padding:18px 18px 16px}
.eye{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:600;color:var(--c)}
.eye>i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.hero h2{margin:5px 0 14px;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.035em}
.cap{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:8px;display:flex;justify-content:space-between}
.cap span:last-child{font-weight:500;color:var(--mute)}
.nbs{display:grid;gap:9px}
.nb{display:grid;grid-template-columns:92px 62px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:15px}
.nl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl small{display:block;font-size:11px;font-weight:500;color:var(--sub);margin-top:-1px}
.na{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.nbar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--x) 16%,transparent);overflow:hidden}
.nbar b{display:block;height:100%;border-radius:4px;background:var(--x)}
.np{font-size:13px;font-weight:600;color:var(--x);text-align:right;font-variant-numeric:tabular-nums}
.learn{margin:14px 0 0;padding:11px 13px;border-radius:12px;background:var(--fill);font-size:14px;color:var(--ink);line-height:1.45}
.learn b{color:var(--blue);font-weight:600;margin-right:6px}
.two{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;min-width:0;height:46px;padding:0 12px;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.gh{background:var(--fill);color:var(--blue)}
.ovr{margin-top:12px;font-size:13px;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ovr .lnk{font-size:13px;font-weight:600}
.more{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:46px;padding:0 16px 0 18px;border-top:.5px solid var(--sep);font-size:15px;color:var(--sub)}
.chev{color:var(--mute);font-size:22px;line-height:1;font-weight:300;transition:transform .2s}
.ch{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--sub);padding:14px 16px 2px}
.ch span:last-child{font-weight:400}
.list{padding-left:16px}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px 11px 0;width:100%;text-align:left}
.list>.row+.row,.list>details+details,.list>details+.row,.list>.row+details{border-top:.5px solid var(--sep)}
.row .k{width:48px;flex:none;font-size:15px;color:var(--sub);align-self:flex-start;padding-top:1px}
.v{flex:1;min-width:0}
.t{font-size:17px}
.t15{font-size:15px}
.sb{font-weight:600}
.s{font-size:13px;color:var(--sub);margin-top:2px}
.lb{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:1px}
.lnk{color:var(--blue)}
.tb{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 14px;border-radius:999px;background:var(--fill);color:var(--blue);font-size:15px;font-weight:600;white-space:nowrap;flex:none}
.tb.f{background:var(--blue);color:#fff}
.pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--fill);color:var(--sub);white-space:nowrap}
.pill.w{color:var(--orange);background:color-mix(in srgb,var(--orange) 15%,transparent)}
.pill.g{color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}
.ab{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center;flex:none}
.ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;background:var(--c)}
.ic svg{width:21px;height:21px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkh{display:flex;align-items:center;gap:2px;padding:0 0 4px}
.wkh span{margin-right:auto;font-size:15px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.wkh .tb{height:28px;padding:0 12px;font-size:13px;margin-right:4px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
.day .w{font-size:11px;font-weight:600;color:var(--sub)}
.day .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-variant-numeric:tabular-nums}
.day i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.day.today .n{color:var(--red);font-weight:600}
.day.on .n{background:var(--ink);color:var(--bg);font-weight:600}
.day.on.today .n{background:var(--red);color:#fff}
.rings{display:flex;align-items:center;gap:22px;padding:10px 16px 14px}
.rg{flex:none}
.legs{flex:1;display:grid;gap:7px}
.lg{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
.lg i{width:10px;height:10px;border-radius:50%;background:var(--x)}
.lg b{margin-left:auto;color:var(--x);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.mini{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-top:.5px solid var(--sep);font-size:13px;color:var(--sub)}
.mini b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.mini .chev{margin-left:auto}
.nts{display:flex;flex-wrap:wrap;gap:6px}
.nt{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--sub);white-space:nowrap}
.nt::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--x)}
.nt.plain::before{display:none}
.nt em{font-style:normal;color:var(--mute);margin-left:2px}
.dd{width:40px;flex:none;display:flex;flex-direction:column;line-height:1.2}
.dd b{font-size:17px;font-weight:600}
.dd small{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.dd.td b{color:var(--red)}
.cb{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.habit{font-size:13px;color:var(--sub);text-align:center;margin:6px 0 24px}
.sec{margin-bottom:26px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 16px 7px;font-size:13px;color:var(--sub)}
.sf{padding:7px 16px 0;font-size:13px;color:var(--sub);margin:0}
.grp{background:var(--card);border-radius:14px;overflow:hidden}
.cell{padding:14px 16px}
.axn{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--x);font-size:13px}
.axn::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--x)}
.ngh,.ng{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,14px) 40px;gap:0 6px;align-items:center}
.ngh{padding:0 16px 7px;font-size:12px;color:var(--sub)}
.ngh>i{font-style:normal;text-align:center}
.ngh>i.cur{color:var(--ink);font-weight:700}
summary.row.ng{display:grid}
.nn{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{width:9px;height:9px;border-radius:50%;background:var(--fill);justify-self:center;display:inline-block}
.dt.m{background:var(--x)}
.dt.s{background:transparent;box-shadow:inset 0 0 0 1.5px var(--x)}
.fr{text-align:right;font-size:15px;font-weight:600;color:var(--orange);font-variant-numeric:tabular-nums}
.fr.ok{color:var(--green)}
.nd{padding:0 16px 14px 0;font-size:15px;color:var(--sub)}
.nd>p{margin:0}
.kv{display:grid;grid-template-columns:52px 1fr;gap:7px 10px;margin-top:10px}
.kv>span{font-size:13px;color:var(--sub);padding-top:2px}
.kv>p{margin:0;font-size:15px;color:var(--ink)}
.lv{font-style:normal;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green);margin-left:4px;white-space:nowrap}
.lv.r{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange)}
.lg2{display:flex;gap:12px;align-items:center}
.lg2 span{display:inline-flex;align-items:center;gap:5px}
.ck{color:var(--green);font-weight:700;margin-left:4px;font-size:13px}
.srcl{font-size:12px;color:var(--sub);grid-column:1/-1;margin-top:-4px}
.search{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:10px;background:var(--card);color:var(--sub);margin-bottom:12px}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px;color:var(--ink);min-width:0;-webkit-appearance:none}
.seg{display:flex;gap:8px;overflow-x:auto;padding-bottom:16px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button,.segsel{flex:none;height:32px;padding:0 14px;border-radius:999px;background:var(--card);font-size:15px;font-weight:500;border:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.segsel{-webkit-appearance:none;appearance:none;color:var(--blue)}
.mi[open] .chev{transform:rotate(90deg)}
.mdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.rq{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--fill)}
.rq p{flex:1;margin:0;color:var(--ink);font-size:15px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.nd .nbs{margin-top:12px}
.nd .nts{margin-top:10px}
.tier .k{width:46px;font-size:20px;font-weight:700;color:var(--ink);padding-top:0;line-height:1.2}
.tier .k small{display:block;font-size:11px;font-weight:500;color:var(--sub)}
.tier .nts{margin-top:8px}
.amr{align-items:flex-start}
.amr .nm{width:110px;flex:none;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.amr .nm::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--x);flex:none}
.pat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;line-height:1.25}
.pat div{padding:10px 2px;border-radius:10px;background:var(--fill)}
.pat b{display:block;font-size:15px}
.pat i{display:block;width:8px;height:8px;border-radius:50%;margin:6px auto;background:var(--c)}
.pat small{display:block;color:var(--sub);font-size:11px;margin-top:3px}
.top5{display:grid;gap:6px;margin-top:6px}
.top5 div{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink)}
.top5 span:last-child{color:var(--sub);font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fd .25s}
.sheet .sc{position:relative;width:100%;max-width:640px;height:93vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:6px 16px calc(28px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@media(min-width:760px){.sheet{align-items:center}.sheet .sc{height:auto;max-height:88vh;border-radius:14px}}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--mute);margin:0 auto}
.shd{position:sticky;top:-6px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;height:50px;margin:0 -16px 6px;padding:0 16px;background:var(--bg)}
.shd b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;flex:1}
.shd span,.shd .lnk{width:44px;flex:none}
.shd .lnk{font-weight:600;text-align:right}
.sheet select,.sheet input[type=time]{border:0;background:var(--fill);border-radius:8px;height:34px;padding:0 10px;font-size:17px;color:var(--ink);-webkit-appearance:none;appearance:none}
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill);position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
.bts{display:flex;gap:10px;margin:18px 0 14px}
.bts .btn.gh{background:var(--card)}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,10px) scale(.96);opacity:0;pointer-events:none;background:var(--bar);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);color:var(--ink);padding:12px 20px;border-radius:999px;font-size:15px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.18);transition:.25s;z-index:70;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
@media(max-width:759px){
.nav .ttl{text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;padding:6px 0 calc(4px + env(safe-area-inset-bottom));background:var(--bar);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid var(--sep);display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{flex-direction:column;gap:2px;padding:2px 0;font-size:10px;font-weight:500;color:var(--sub);border-radius:0;justify-content:center;background:none!important;box-shadow:none!important}
.tabs button svg{display:block;width:26px;height:26px}
.tabs button[aria-current=page]{color:var(--blue);font-weight:600}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.toast{bottom:calc(96px + env(safe-area-inset-bottom))}
}
@media(max-width:420px){.lt h1{font-size:32px}.hero h2{font-size:26px}.rings{gap:14px}.rg{width:110px;height:110px}.nb{grid-template-columns:80px 58px minmax(0,1fr) 42px;gap:8px;font-size:14px}.amr{flex-wrap:wrap}.amr .nm{width:100%}}
</style>
</head>
<body>
<header class='nav' id='nav'><div class='wrap'>
<span class='ttl' id='ttl'></span>
<nav class='tabs' id='tabs'></nav>
<span class='rt'><button class='ib' data-open='ics' aria-label='캘린더 알림' id='bell'></button></span>
</div></header>
<main class='wrap'>
<div class='lt'><small id='eyb'></small><h1 id='h1'></h1></div>
<section id='v-today'></section>
<section id='v-week' class='hide'></section>
<section id='v-guide' class='hide'></section>
</main>
<div id='sheet' class='sheet hide'><div class='bd' data-close></div>
<div class='sc' role='dialog'>
<div class='shd'><span></span><b id='sht'></b><button class='lnk' data-close>완료</button></div>
<div id='shb'></div>
</div></div>
<div id='toast' class='toast' role='status'></div>
<script>
const EPOCH='2026-01-05',GAP=11,FAM_GAP=5,RAW_OFF=[6,7,8,9],O3T=3.5,SALT_MAX=3,GRILL_MAX=3;
const BS=String.fromCharCode(92),CR=String.fromCharCode(13),NL=String.fromCharCode(10),CRLF=CR+NL;
const AX={S:{n:'피부',c:'var(--xS)'},E:{n:'눈',c:'var(--xE)'},V:{n:'혈관',c:'var(--xV)'},A:{n:'건강한 노화',c:'var(--xA)'}};
const CAT={F:{n:'등푸른생선',c:'var(--cF)'},B:{n:'소고기',c:'var(--cB)'},L:{n:'양고기',c:'var(--cL)'},P:{n:'돼지고기',c:'var(--cP)'},S:{n:'조개·해산물',c:'var(--cS)'},W:{n:'흰살생선',c:'var(--cW)'},V:{n:'두부·계란·채소',c:'var(--cV)'}};
const SHOP={sal:'샐러드·포케',gri:'생선구이집',raw:'횟집',eel:'장어집',bbq:'고깃집',soup:'국·탕집',shabu:'샤브·전골',west:'양식·브런치',bossam:'보쌈집',jok:'족발집',sea:'해물찜·탕',hansik:'한식 정식',lamb:'양고기집',yuk:'육회집',don:'덮밥집'};

  const orig=sc.length?sc[0].d:D[0];let m=orig,ovr=false;

  m.tags.forEach(n=>{s.la[n]=t});s.ld[m.id]=t;s.lf[m.fam]=t;
  const V2={};NK.forEach(n=>{V2[n]=m.tags.includes(n)?0:(urg(s.la,n,t)+Math.max(0,RQ[n]-c6[n])/RQ[n])*NUT[n].w});
  let ep=SN.filter(x=>!x.months||x.months.includes(mo));
  const fe=ep.filter(x=>s.ls[x.id]===undefined||t-s.ls[x.id]>3);if(fe.length)ep=fe;
  if(!m.tags.includes('c')){const cc=ep.filter(x=>x.tags.includes('c'));if(cc.length)ep=cc}
  const es=ep.map(x=>({x,v:need(x.tags,V2)+(m.lite&&x.pro?3:0)+(s.ls[x.id]===undefined?3:Math.min(3,(t-s.ls[x.id])/5))}));
  es.sort((a,b)=>b.v-a.v||SN.indexOf(a.x)-SN.indexOf(b.x));
  const k=es[0].x;s.eve[t]=k;k.tags.forEach(n=>{s.la[n]=t});s.ls[k.id]=t;
 }

function near(id,t){for(let u=Math.max(0,t-GAP+1);u<=t+GAP-1;u++){if(u===t)continue;const M=SCH.meal[u];if(M&&M.d.id===id)return true}return false}
const ROLE={A:['같은 재료 · 다른 가게','이 가게가 안 될 때'],B:['어디서나 되는 메뉴','동네 선택지가 적을 때'],C:['다른 단백질','이 재료가 안 당길 때']};
function altsFor(t){
 build(t+GAP);const s=SCH;if(s.alt[t])return s.alt[t];
 const m=s.meal[t].d,cx=s.ctx[t],cats=SLOT[t%7],W={};let tot=0;
 m.tags.forEach(n=>{W[n]=Math.max(.25*NUT[n].w,cx.VAL[n]);tot+=W[n]});tot=tot||1;
 const all=D.filter(d=>d!==m&&avail(d,cx.mo)&&!near(d.id,t)&&!(d.salt&&cx.nS>=SALT_MAX)&&!(d.grill&&cx.nG>=GRILL_MAX)).map(d=>{const match=m.tags.reduce((a,n)=>a+(d.tags.includes(n)?W[n]:0),0)/tot;return{d,match,v:match*10+d.ub*.6+Math.min(d.o3,2.5)*.3}}).sort((a,b)=>b.v-a.v||D.indexOf(a.d)-D.indexOf(b.d));
 const out=[],shops=new Set([m.shop]);
 const take=(role,f,strict)=>{if(out.some(o=>o.role===role))return;const x=all.find(y=>!out.some(o=>o.d===y.d)&&(!strict||!shops.has(y.d.shop))&&f(y.d));if(x){shops.add(x.d.shop);out.push(Object.assign({role},x))}};
 take('A',d=>cats.includes(d.cat),true);take('A',d=>cats.includes(d.cat),false);
 take('B',d=>d.ub===3,true);take('B',d=>d.ub>=2,true);take('B',d=>d.ub===3,false);
 take('C',d=>!cats.includes(d.cat),true);take('C',d=>!cats.includes(d.cat),false);
 ['A','B','C'].forEach(r=>take(r,()=>true,false));
 const res=out.sort((a,b)=>a.role<b.role?-1:1).map(x=>({d:x.d,role:x.role,match:Math.round(x.match*100)}));
 s.alt[t]=res;return res;
}

  return{n,cells,mc,ac,req:RQ[n]}});
 const by={};rows.forEach(r=>{by[r.n]=r});
 const axes=Object.keys(AX).map(k=>{const ns=NK.filter(n=>NUT[n].ax===k);return{k,ns,all:ns.reduce((a,n)=>a+Math.min(1,by[n].ac/by[n].req),0)/ns.length}});
 let o3=0,salt=0,grill=0;
 for(let i=0;i<7;i++){const d=SCH.meal[t0+i].d;o3+=d.o3;if(d.salt)salt++;if(d.grill)grill++}

}

function closeSheet(){$('#sheet').classList.add('hide');document.body.style.overflow='';SHEET=null}
function drawSheet(){const r=({lunch:shLunch,bal:shBal,menu:shMenu,ics:shIcs,g:shGuide})[SHEET.kind](SHEET.arg);$('#sht').textContent=r[0];$('#shb').innerHTML=r[1];if(SHEET.kind==='menu')bindMenu()}

function shLunch(){const M=SCH.meal[SEL],d=M.d;
 const num=NK.filter(n=>d.amt[n]>0).sort((a,b)=>pctOf(b,d.amt[b])-pctOf(a,d.amt[a]));
 const rows=num.map(n=>barRow(n,d.amt[n],d.tags.includes(n)?'✓ 섭취 인정':'')+`<div class='srcl'>${d.src[n].filter(x=>x.v>0).slice(0,2).map(x=>x.n+' '+x.g+'g → '+fmt(n,x.v)).join(' · ')}</div>`).join('');
 const notes=[d.salt?'국물은 1/3만, 건더기 위주로':'',d.raw?'날것 — 6~9월엔 자동 제외':'',d.lite?'단백질이 가벼워 저녁에 단백질 보강':''].filter(Boolean).join(' · ');
 return [d.name,`<div class='sec'><div class='sh'><span>주문</span><span>${SHOP[d.shop]} · ${UB[d.ub]}</span></div><div class='grp list'>
<div class='row'><span class='k'>검색</span><div class='v t'>${d.kw}</div><button class='tb' data-copy='${esc(d.kw)}'>복사</button></div>
${d.req?`<div class='row'><span class='k'>요청</span><div class='v t15'>${d.req}</div><button class='tb' data-copy='${esc(d.req)}'>복사</button></div>`:''}
<div class='row'><span class='k'>팁</span><div class='v t15'>${d.tip}</div></div>
${d.org?`<div class='row'><span class='k'>원산지</span><div class='v t15'>${d.org}</div></div>`:''}</div>${notes?`<p class='sf'>${notes}</p>`:''}</div>
<div class='sec'><div class='sh'><span>이 한 끼에 든 양</span><span>하루 기준 대비</span></div><div class='grp cell'><div class='nbs'>${rows}</div>${d.tags.includes('poly')?`<p class='s' style='margin:12px 0 0'>+ 폴리페놀 (양파·마늘·올리브유 등 — 정량 기준 없음)</p>`:''}</div><p class='sf'>구성: ${d.comp.map(x=>x.n+' '+x.g+'g').join(' · ')}. 일반 1인분 기준 추정치. ✓는 하루 기준의 30% 이상(오메가3는 1g 이상, 비타민C는 50% 이상)이라 「섭취」로 인정한 것.</p></div>`]}

function nutRow(r,k,tot){const N=NUT[r.n],L=lastOf(r.n,SEL),X=nextOf(r.n,SEL),due=L===null?'':(L+N.g<=SEL?'지금 필요':md(L+N.g)+'까지 다시');
 const h=r.n!=='poly';
 return `<details class='nr' style='--x:${AX[k].c}'><summary class='row ng'><span class='nn'>${N.n}</span>${r.cells.map(c=>`<i class='dt${c===2?' m':c===1?' s':''}'></i>`).join('')}<span class='fr${r.ac>=r.req?' ok':''}'>${r.ac}/${r.req}</span></summary>
<div class='nd'><p>${N.why}</p><div class='kv'>
<span>간격</span><p>${every(N.g)} · 7일에 ${r.req}회<i class='lv${N.lv==='연구'?' r':''}'>${N.lv}</i></p>
${h?`<span>7일 섭취</span><p>${nl(r.n)} 합계 ${fmt(r.n,tot[r.n])} · 하루 평균 ${fmt(r.n,tot[r.n]/7)} — 하루 기준 ${fmt(r.n,REF[r.n])}${RLAB[r.n]?'('+RLAB[r.n]+')':''}의 ${pctOf(r.n,tot[r.n]/7)}%</p>`:''}
<span>다음</span><p>${L===null?'최근 3주 없음':'마지막 '+md(L)+' → '+due}${X?' · 예정 '+wd(X.u)+' '+md(X.u)+' '+X.what:''}</p>
<span>얼마나</span><p>${N.amt}</p>
${h?`<span>많은 음식</span><div class='top5'>${TOP5[r.n].map(I=>`<div><span>${I.n}</span><span>100g당 ${fmt(r.n,I.v[r.n])}</span></div>`).join('')}</div>`:`<span>급원</span><p>${N.src}</p>`}
</div></div></details>`}
function shBal(){const st=stats(ANCHOR),tot=weekTot(ANCHOR);
 let h=`<div class='grp' style='margin-bottom:26px'>${ringBlock(st)}${miniBlock(st,0)}</div><div class='sh'><span>점 하나 = 하루 · 누르면 자세히</span><span class='lg2'><span><i class='dt m' style='--x:var(--sub)'></i>점심</span><span><i class='dt s' style='--x:var(--sub)'></i>저녁</span></span></div>`;
 Object.keys(AX).forEach(k=>{const days=[0,1,2,3,4,5,6].map(i=>`<i class='${ANCHOR+i===SEL?'cur':''}'>${wd(ANCHOR+i)}</i>`).join('');
  h+=`<div class='sec'><div class='ngh'><span class='axn' style='--x:${AX[k].c}'>${AX[k].n}</span>${days}<span></span></div><div class='grp list'>${st.rows.filter(r=>NUT[r.n].ax===k).map(r=>nutRow(r,k,tot)).join('')}</div></div>`});
 return ['7일 밸런스 · '+md(ANCHOR)+'–'+md(ANCHOR+6),h]}

function shMenu(){const cats=[['all','전체'],...Object.entries(CAT).map(([k,v])=>[k,v.n])];
 return [md(SEL)+' ('+wd(SEL)+') 점심 고르기',`<div class='search'>${IC.search}<input id='mq' type='search' placeholder='메뉴·재료 검색' value='${esc(MF.q)}'></div><div class='seg'>${cats.map(([k,n])=>`<button data-mc='${k}' class='${MF.cat===k?'on':''}'>${n}</button>`).join('')}<select id='mn' class='segsel' aria-label='영양소'><option value=''>영양소 ▾</option>${NK.map(n=>`<option value='${n}'${MF.nut===n?' selected':''}>${NUT[n].n} 많은 순</option>`).join('')}</select></div><div id='ml'></div>`]}
function bindMenu(){$('#mq').oninput=e=>{MF.q=e.target.value;menuList()};$('#mn').onchange=e=>{MF.nut=e.target.value;menuList()};menuList()}
function menuList(){
 const q=MF.q.trim(),mo=monthOf(SEL),cur=SCH.meal[SEL].d,nu=MF.nut&&MF.nut!=='poly'?MF.nut:'';
 const L=D.filter(d=>(MF.cat==='all'||d.cat===MF.cat)&&(!MF.nut||d.tags.includes(MF.nut))&&(!q||(d.name+d.kw+d.comp.map(x=>x.n).join('')).includes(q)));
 if(nu)L.sort((a,b)=>(b.amt[nu]||0)-(a.amt[nu]||0));
 $('#ml').innerHTML=`<div class='sh'><span>${L.length}개${nu?' · '+nl(nu)+' 많은 순':''}</span></div><div class='grp list'>`+(L.length?L.map(d=>{const nr=d!==cur&&near(d.id,SEL),na=!avail(d,mo);const top=d.tags.filter(n=>n!=='poly').sort((a,b)=>pctOf(b,d.amt[b])-pctOf(a,d.amt[a]));const sub=(nu?[nu]:top.slice(0,3)).map(n=>nl(n)+' '+fmt(n,d.amt[n]||0)).join(' · ');
  return `<details class='mi'><summary class='row'><span class='mdot' style='--c:${CAT[d.cat].c}'></span><div class='v'><div class='t ellip'>${d.name}</div><div class='s ellip'>${sub}</div></div><span class='chev'>›</span></summary>
<div class='nd'><p>${SHOP[d.shop]} · ${UB[d.ub]} · ${d.tip}</p><div class='nbs'>${top.slice(0,5).map(n=>barRow(n,d.amt[n])).join('')}</div><p class='s' style='margin-top:10px'>구성: ${d.comp.map(x=>x.n+' '+x.g+'g').join(' · ')}</p><div class='acts'>${d===cur?`<span class='pill g'>이날 메뉴</span>`:`<button class='tb f' data-pick='${d.id}'>이 메뉴로</button>`}${nr?`<span class='pill w'>10일 안에 겹침</span>`:''}${na?`<span class='pill w'>제철 아님·여름 날것</span>`:''}</div></div></details>`}).join(''):`<div class='row'><div class='v s'>검색 결과 없음</div></div>`)+'</div>'}

function shIcs(){return ['캘린더 알림',`<p class='sf' style='padding:0 16px 14px'>아이폰·갤럭시 기본 캘린더에 매일 점심 메뉴·요청사항·대체 3개·핵심 영양, 그리고 저녁이 알림으로 뜹니다.</p>
<div class='grp list'>
<label class='row'><span class='v'>기간</span><select id='icN'>${[[14,'2주'],[30,'30일'],[60,'60일'],[90,'90일']].map(([v,n])=>`<option value='${v}'${v===30?' selected':''}>${n}</option>`).join('')}</select></label>
<label class='row'><span class='v'>점심 알림</span><input id='icL' type='time' value='11:00'></label>
<label class='row'><span class='v'>저녁 알림</span><input id='icS' class='sw' type='checkbox' checked></label>
<label class='row'><span class='v'>저녁 시간</span><input id='icT' type='time' value='18:30'></label></div>
<div class='bts'><button class='btn' data-dl>.ics 다운로드</button><button class='btn gh' data-ct>텍스트 복사</button></div>
<p class='sf'>파일을 열고 「모두 추가」 → 새 캘린더 「식단」에 넣으세요. 메뉴를 바꾸면 「식단」 캘린더를 지우고 다시 내보내면 됩니다.</p>`]}

function shGuide(key){
 const rows=a=>`<div class='grp list'>${a.map(x=>`<div class='row'><div class='v t15'>${x}</div></div>`).join('')}</div>`;
 if(key==='learn')return['영양소 사전',Object.keys(AX).map(k=>`<div class='sec'><div class='sh'><span class='axn' style='--x:${AX[k].c}'>${AX[k].n}</span></div><div class='grp list'>${NK.filter(n=>NUT[n].ax===k).map(n=>{const N=NUT[n],h=n!=='poly';return `<details class='mi'><summary class='row'><div class='v'><div class='t'>${N.n}</div><div class='s ellip'>${h?'하루 '+(n==='km'?'칼륨 ':'')+fmt(n,REF[n])+' · ':''}${every(N.g)} · ${N.lv}</div></div><span class='chev'>›</span></summary><div class='nd'><p>${N.why}</p><div class='kv'><span>얼마나</span><p>${N.amt}</p>${h?`<span>많은 음식</span><div class='top5'>${TOP5[n].map(I=>`<div><span>${I.n}</span><span>100g당 ${fmt(n,I.v[n])}</span></div>`).join('')}</div>`:`<span>급원</span><p>${N.src}</p>`}${N.rel?`<span>관련</span><p>${N.rel}</p>`:''}</div></div></details>`}).join('')}</div></div>`).join('')+`<p class='sf'>각 영양소는 주된 축 하나에만 넣어 겹치지 않게(MECE) 했습니다. <i class='lv'>확립</i> 생리 기능 확립 · <i class='lv r'>연구</i> 식품 효과는 연구 단계.</p>`];
 if(key==='gap'){const TW={1:'거의 저장되지 않음 — 저녁 과일·채소로 매일',2:'저장고가 없거나 금방 빠짐 — 이틀에 한 번',3:'회전이 빠르거나 연구 단계 성분 — 사흘에 한 번',4:'조직에 천천히 쌓임 — 주 2회면 충분',7:'간·지방에 저장 — 주 1회면 충분, 매일 많이는 과잉'};
  return['얼마 후에 다시 먹나',`<div class='grp list'>${[1,2,3,4,7].map(x=>`<div class='row tier' style='align-items:flex-start'><span class='k'>${gl(x)}<small>7일 ${Math.ceil(7/x)}회</small></span><div class='v'><div class='t15'>${TW[x]}</div><div class='nts'>${NK.filter(n=>NUT[n].g===x).map(ntc).join('')}</div></div></div>`).join('')}</div><p class='sf'>예) 화요일에 소고기 150g(아연 7.5mg)을 먹었다면 목요일까지 굴·게·소고기 같은 아연 메뉴로 다시 채웁니다. 아연은 저장되지 않아 몰아먹기보다 간격이 중요하고, 비타민A·D는 저장되므로 주 1회면 충분합니다.</p>`]}
 if(key==='amt')return['얼마나 먹나',`<div class='grp list'>${NK.map(n=>`<div class='row amr' style='--x:${axc(n)}'><span class='nm'>${nn(n)}</span><div class='v t15' style='color:var(--sub)'>${NUT[n].amt}</div></div>`).join('')}</div><p class='sf'>권장량은 한국인 영양소 섭취기준(2020) 성인 기준, 함량은 1인분 추정치입니다.</p>`];
 if(key==='rot'){const PAT=[['월','등푸른생선','F','오메가3'],['화','소·양','B','아연·콜라겐'],['수','해산물','S','아연·구리'],['목','등푸른생선','F','오메가3'],['금','돼지','P','콜라겐'],['토','해산물·흰살','S','셀레늄'],['일','가벼운 날','V','채소·계란']];
  return['로테이션 규칙',`<div class='grp cell' style='margin-bottom:26px'><div class='pat'>${PAT.map(x=>`<div style='--c:${CAT[x[2]].c}'><b>${x[0]}</b><i></i>${x[1]}<small>${x[3]}</small></div>`).join('')}</div></div>${rows(['같은 메뉴는 먹은 다음 날부터 <b>10일 동안</b> 다시 나오지 않습니다 (11일째부터)','같은 재료(고등어구이·고등어조림 등)는 5일 안에 다시 안 나옵니다','간격이 지났거나 최근 7일에 부족한 영양소를 많이 채우는 메뉴, 오래 안 먹은 메뉴를 우선합니다','국물 메뉴·직화 구이는 7일에 각 3회까지 — 탄 부분의 당화산물은 콜라겐에 불리','저녁은 점심에 빠진 영양소를 채우고, 점심에 비타민C가 없으면 반드시 과일·파프리카로','제철 자동 반영, 6~9월엔 날것 제외 · 어느 기기에서나 같은 날 같은 메뉴'])}`]}
 if(key==='alt')return['대체 메뉴 3개',`<div class='grp list'>${['A','B','C'].map(r=>`<div class='row'><span class='ab' style='--c:var(--cF)'>${r}</span><div class='v'><div class='t'>${ROLE[r][0]}</div><div class='s'>${ROLE[r][1]}</div></div></div>`).join('')}</div><p class='sf'>배달이 안 되는 이유별로 하나씩입니다. 셋은 가게 유형이 모두 다르고, 앞뒤 10일 메뉴와 겹치지 않습니다. 바꾸면 다음 날부터 빠진 영양소를 우선 채우도록 다시 계산됩니다.</p>`];
 if(key==='out')return['빼는 것',rows(['닭·오리, 가공육(햄·소시지·베이컨)','공기밥·면·사리·떡·빵·튀김옷 — 비빔밥·덮밥만 밥 1/3','단 양념 — 당은 콜라겐을 굳히는 당화를 늘립니다','배달 김치, 곱창·순대·내장류','생 조개·굴, 여름철 날것'])];
 return['꼭 알아둘 것',rows(['<b>자외선차단제가 1순위</b> — 라이코펜·오메가3는 보조','비타민D — 10~3월엔 식사만으론 부족하기 쉬움, 혈중 농도 검사 후 보충 고려','아연 보충제를 고용량으로 오래 먹으면 구리 결핍 위험 — 음식은 괜찮음','와파린 복용 중이면 녹즙·잎채소·청국장 양을 일정하게 (비타민K)','브라질너트는 하루 2알 이하 (셀레늄 과잉)','통풍·질환·복용약이 있으면 담당 의사와 먼저 상의'])+`<p class='sf'>참고: 한국인 영양소 섭취기준(2020), 국가표준식품성분표, 미국 NIH ODS·USDA, Stahl 2001·Rizwan 2011 토마토 페이스트 광보호 시험, 경구 콜라겐 메타분석(2023~2025), AREDS2.</p>`]}

function render(){
 TODAY=Math.max(0,tOf(todayStr()));
 build(Math.max(ANCHOR+7,SEL,TODAY)+21);
 const s=sOf(SEL),dt=new Date(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)));
 const full=`${dt.getUTCMonth()+1}월 ${dt.getUTCDate()}일 ${WD[dt.getUTCDay()]}요일`;
 const T={today:[full,SEL===TODAY?'오늘':md(SEL)+' 식단'],week:[md(ANCHOR)+' – '+md(ANCHOR+6),ANCHOR===TODAY?'이번 주':'주간'],guide:['피부 · 눈 · 혈관 · 건강한 노화','원칙']}[TAB];
 $('#eyb').textContent=T[0];$('#h1').textContent=T[1];$('#ttl').textContent=T[1];
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===TAB?'page':'false'));
 ['today','week','guide'].forEach(v=>$('#v-'+v).classList.toggle('hide',v!==TAB));
 ({today:renderToday,week:renderWeek,guide:renderGuide})[TAB]();
}

document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-open],[data-close]');if(!b)return;const o=b.dataset;
 if('copy' in o){copy(o.copy);return}
 if('close' in o){closeSheet();return}
 if('open' in o){openSheet(o.open,o.g);return}
 if('tab' in o){TAB=o.tab;render();scrollTo(0,0);return}
 if('day' in o){SEL=+o.day;if(o.go){TAB=o.go;render();scrollTo(0,0)}else render();return}
 if('wk' in o){const v=+o.wk;if(v===0){ANCHOR=TODAY;SEL=TODAY}else{const off=SEL-ANCHOR;ANCHOR=Math.max(0,ANCHOR+7*v);SEL=ANCHOR+off}render();return}
 if('pick' in o){const key=sOf(SEL),orig=SCH.meal[SEL].orig.id,id=o.pick,d=D.find(x=>x.id===id);
  const warn=!avail(d,monthOf(SEL))?'제철이 아니거나 여름 날것이에요':near(id,SEL)?'10일 안에 같은 메뉴가 있어요':'';
  if(id===orig)delete OVR[key];else OVR[key]=id;SCH=null;saveOvr();if(SHEET)closeSheet();TAB='today';render();scrollTo(0,0);
  toast(warn?'지정했어요 · '+warn:'바꿨어요 · 이후 일정도 다시 맞췄어요');return}
 if('unpick' in o){delete OVR[sOf(SEL)];SCH=null;saveOvr();render();toast('원래 추천으로 돌렸어요');return}
 if('mc' in o){MF.cat=o.mc;drawSheet();return}
 if('dl' in o){dl();return}
 if('ct' in o){copy(makeIcs());return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SHEET)closeSheet();if(e.key==='Enter'&&e.target.dataset&&'open' in e.target.dataset)openSheet(e.target.dataset.open,e.target.dataset.g)});
addEventListener('scroll',()=>{$('#nav').classList.toggle('sc',scrollY>44)},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const nt=Math.max(0,tOf(todayStr()));if(nt!==TODAY){if(ANCHOR===TODAY)ANCHOR=nt;if(SEL===TODAY)SEL=nt;render()}});

$('#tabs').innerHTML=[['today','오늘'],['week','주간'],['guide','원칙']].map(([k,n])=>`<button data-tab='${k}'>${IC[k]}<span>${n}</span></button>`).join('');
$('#bell').innerHTML=IC.bell;
(async()=>{TODAY=Math.max(0,tOf(todayStr()));SEL=ANCHOR=TODAY;await loadOvr();render()})();
</script>
</body>
