<!DOCTYPE html>
<html lang='ko'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='theme-color' content='#F5F5F7' media='(prefers-color-scheme: light)'>
<meta name='theme-color' content='#000000' media='(prefers-color-scheme: dark)'>
<title>한 끼</title>
<link rel='stylesheet' href='https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css'>
<style>
:root{--font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;--bg:#F5F5F7;--card:#fff;--tx:#1D1D1F;--tx2:#6E6E73;--tx3:#86868B;--tx4:#C7C7CC;--sep:rgba(0,0,0,.08);--bl:#0071E3;--bl2:#E8F0FE;--bl3:#0062C4;--red:#E5484D;--red2:#FDECEC;--fill:#F0F0F3;--sh:0 1px 2px rgba(0,0,0,.05);--top:rgba(255,255,255,.86)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--tx:#F5F5F7;--tx2:#A1A1A6;--tx3:#8E8E93;--tx4:#48484A;--sep:rgba(255,255,255,.1);--bl:#2997FF;--bl2:rgba(41,151,255,.16);--bl3:#0A84FF;--red:#FF6961;--red2:rgba(255,105,97,.16);--fill:#2C2C2E;--sh:none;--top:rgba(28,28,30,.82)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.5 var(--font);color:var(--tx);background:var(--bg);font-feature-settings:'tnum';-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.01em;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
button[disabled]{cursor:default}
.top{position:sticky;top:0;z-index:20;background:var(--top);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep);padding-top:env(safe-area-inset-top)}
.top .in{max-width:880px;margin:0 auto;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.mk{width:28px;height:28px;border-radius:8px;background:var(--bl);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.sp{flex:1}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 13px;border-radius:8px;font-size:14px;font-weight:500;color:var(--tx2)}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
main{max-width:880px;margin:0 auto;padding:26px 16px calc(96px + env(safe-area-inset-bottom))}
@media(min-width:760px){main{padding:40px 32px 120px}}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
@media(min-width:760px){h1{font-size:32px}}
.lead{color:var(--tx2);font-size:14.5px;margin-top:4px}
.nav{display:flex;gap:6px;align-items:center;flex-shrink:0;padding-bottom:2px}
.ib{width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--bl);font-size:20px;line-height:1;padding-bottom:2px}
.ib[disabled]{opacity:.35}
.chipb{padding:6px 12px;border-radius:999px;background:var(--bl2);color:var(--bl);font-size:13px;font-weight:600}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:18px}
.wd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;border-radius:12px;background:var(--card);box-shadow:var(--sh);border:1px solid transparent}
.wd small{font-size:11px;color:var(--tx3);font-weight:500}
.wd b{font-size:17px;font-weight:600}
.wd i{width:5px;height:5px;border-radius:50%;margin-top:2px}
.wd.rec i{background:var(--bl)}
.wd.td b{color:var(--bl)}
.wd.fut{background:transparent;box-shadow:none;border:1px dashed var(--tx4)}
.wd.fut b{color:var(--tx2);font-weight:500}
.wd[disabled]{opacity:.35}
.wd.on{background:var(--bl);box-shadow:none;border-color:var(--bl)}
.wd.on small,.wd.on b{color:#fff}
.wd.on.rec i{background:#fff}
.sec{margin-top:32px;scroll-margin-top:70px}
.sec>h2{font-size:13px;font-weight:600;color:var(--tx2);margin:0 0 10px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec>h2 span{font-weight:400;color:var(--tx3);font-size:12.5px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:860px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fc{background:var(--card);border-radius:16px;padding:12px 13px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;min-height:120px;width:100%;transition:transform .15s,box-shadow .15s}
@media(hover:hover){.fc:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.08)}}
.fc:active{transform:scale(.98)}
.fc .no{font-size:12px;color:var(--tx3);display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .no b{color:var(--bl);font-weight:700;font-size:13px}
.fc .nm{font-size:15px;font-weight:650;line-height:1.32;letter-spacing:-.015em}
.cps{display:flex;flex-wrap:wrap;gap:4px}
.fc .cps{margin-top:auto;padding-top:6px}
.cp{display:inline-flex;align-items:center;font-size:11.5px;line-height:1.55;padding:0 7px;border-radius:999px;background:var(--fill);color:var(--tx2);white-space:nowrap;font-style:normal}
.cp.bl{background:var(--bl2);color:var(--bl);font-weight:600}
.cp.rd{background:var(--red2);color:var(--red);font-weight:600}
.fc.sel{box-shadow:0 0 0 2px var(--bl)}
.pk{background:var(--card);border-radius:22px;padding:20px 20px 16px;box-shadow:var(--sh)}
.pk .k{font-size:13px;font-weight:600;color:var(--bl)}
.pk h3{font-size:23px;font-weight:700;letter-spacing:-.025em;margin-top:3px;line-height:1.28}
.pk .sb{color:var(--tx2);font-size:14px;margin-top:3px}
.pk .cps{margin-top:12px}
.pk .cp{font-size:12.5px;padding:1px 9px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:10px;background:var(--fill);color:var(--tx);font-weight:500;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--bl);color:#fff}
.btn.ghost{background:transparent;color:var(--bl)}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.lnk{display:inline-block;color:var(--bl);font-size:13.5px;font-weight:500;padding:10px 6px 4px}
.hint{font-size:12.5px;color:var(--tx3);margin:10px 6px 0;line-height:1.5}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--sep);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .mn{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:600;letter-spacing:-.01em}
.row .sb{font-size:12.5px;color:var(--tx3);margin-top:1px}
.row .t{font-size:14.5px;color:var(--tx)}
.row .rt{font-size:13px;color:var(--tx2);text-align:right;white-space:nowrap;min-width:64px}
.row .rt.bl{color:var(--bl);font-weight:600}
.row .rt.rd{color:var(--red);font-weight:600}
.row .chev{color:var(--tx4);font-size:18px}
button.row:active{background:var(--fill)}
.gh{font-size:12px;font-weight:600;color:var(--tx3);padding:12px 18px 2px;border-bottom:0}
.bar{width:64px;height:6px;border-radius:3px;background:var(--fill);overflow:hidden;flex-shrink:0;display:block}
.bar b{display:block;height:100%;background:var(--bl);border-radius:3px}
.bar b.rd{background:var(--red)}
.note{margin-top:14px;padding:11px 14px;border-radius:12px;background:var(--bl2);color:var(--bl);font-size:13.5px;line-height:1.5}
.note.rd{background:var(--red2);color:var(--red)}
.empty{text-align:center;padding:44px 20px;color:var(--tx3);background:var(--card);border-radius:18px;box-shadow:var(--sh)}
.txt{padding:16px 18px;font-size:14.5px;color:var(--tx2);line-height:1.65}
.txt b{color:var(--tx);font-weight:600}
details.row{display:block;padding:0}
details.row>summary{display:flex;align-items:center;gap:12px;padding:12px 18px;list-style:none;cursor:pointer}
details.row>summary::-webkit-details-marker{display:none}
details.row[open]>summary .chev{transform:rotate(90deg)}
details.row .chev{transition:transform .15s}
details.row .dd{padding:0 18px 14px;font-size:14px;color:var(--tx2);line-height:1.6}
.top5{display:grid;gap:3px;margin-top:8px}
.top5 div{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.top5 span:last-child{color:var(--tx3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media(min-width:760px){.ov{align-items:center}.modal{border-radius:20px;max-height:86vh}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.mh{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mh h2{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.mh .sub{color:var(--tx2);font-size:13.5px;margin-top:2px}
.mh .x{color:var(--tx3);font-size:15px;width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex-shrink:0}
.mb{padding:0 16px 18px;overflow:auto;overscroll-behavior:contain}
.mb h4{font-size:13px;font-weight:600;color:var(--tx2);margin:18px 6px 8px;display:flex;justify-content:space-between}
.mb h4 span{font-weight:400;color:var(--tx3)}
.mb .cps{padding:0 4px}
.mb .cp{font-size:13px;padding:2px 10px;background:var(--card)}
.mb .t{font-size:14.5px;padding:0 6px}
.mf{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--sep);display:flex;gap:8px}
.mf:empty{display:none}
.mf .btn{flex:1;padding:13px;font-size:15px;font-weight:600}
.nt{display:grid;grid-template-columns:minmax(0,1fr) auto 56px 46px;gap:10px;align-items:center;font-size:14px;padding:9px 16px;border-bottom:1px solid var(--sep)}
.nt:last-child{border-bottom:0}
.nt .a{text-align:right;color:var(--tx2);font-size:13px}
.nt .p{text-align:right;font-weight:600;font-size:13px}
.nt .bar{width:56px}
#toast{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(16px);background:rgba(29,29,31,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:99;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.sbox input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--sep);background:var(--card);font:inherit;font-size:16px;color:var(--tx);outline:none;-webkit-appearance:none}
.sbox input:focus{border-color:var(--bl);box-shadow:0 0 0 3px var(--bl2)}
.qseg{display:flex;gap:6px;margin:10px 0 0}
.qseg button{flex:1;padding:8px;border-radius:10px;background:var(--card);font-size:14px;font-weight:500;color:var(--tx2);box-shadow:var(--sh);text-align:center}
.qseg button.on{background:var(--bl);color:#fff}
</style>
</head>
<body>
<header class='top'><div class='in'><div class='brand'><span class='mk'>한</span>한 끼</div><span class='sp'></span><nav class='seg' id='tabs'><button data-tab='today'>오늘</button><button data-tab='log'>기록</button><button data-tab='guide'>원칙</button></nav></div></header>
<main id='main'></main>
<div class='ov' id='ov' data-close><div class='modal' role='dialog' aria-modal='true'><div class='mh'><div><h2 id='mt'></h2><div class='sub' id='ms'></div></div><button class='x' data-close aria-label='닫기'>✕</button></div><div class='mb' id='mb'></div><div class='mf' id='mf'></div></div></div>
<div id='toast' role='status'></div>
<script>
/* 한 끼 v2 데이터 — 성분은 100g(음료는 100ml)당 추정치. 국가표준식품성분표·USDA·일본식품표준성분표 근사 */
const HARD=[
{k:'pro',n:'단백질',u:'g',ref:65,W:1,min:35,w:1.1,why:'근육·피부·면역 단백질의 재료. 몸에 따로 저장하지 않아 매일 먹어야 합니다.'},
{k:'c',n:'비타민C',u:'mg',ref:100,W:1,min:75,w:1,why:'콜라겐을 만드는 효소의 보조인자이자 항산화제. 저장량이 적고 열에 약해 생과일·생채소로 매일 채웁니다.'},
{k:'zn',n:'아연',u:'mg',ref:10,W:4,min:18,w:1.2,why:'세포 분열·상처 회복·피부 재생, 망막의 비타민A 대사. 따로 저장하는 곳이 없어 나흘 안에 다시 채웁니다.'},
{k:'fol',n:'엽산',u:'μg',ref:400,W:3,min:480,w:1,why:'호모시스테인(혈관 손상 지표)을 낮추고 세포 분열에 필요. 열에 약해 생채소·콩이 유리합니다.'},
{k:'mg',n:'마그네슘',u:'mg',ref:360,W:3,min:360,w:.8,why:'300가지 넘는 효소의 보조인자. 혈압·혈당·근육 이완에 관여하고 견과·씨앗·잎채소에 많습니다.'},
{k:'kal',n:'칼륨',u:'mg',ref:3500,W:2,min:2400,w:.8,why:'나트륨을 내보내 혈압을 조절합니다. 배달 음식의 나트륨과 짝으로 챙깁니다.'},
{k:'fib',n:'식이섬유',u:'g',ref:30,W:2,min:14,w:.9,why:'수용성 섬유는 LDL 콜레스테롤과 식후 혈당을 낮추고 장내 미생물의 먹이가 됩니다.'},
{k:'cu',n:'구리',u:'mg',ref:.85,W:4,min:1.8,w:.8,why:'콜라겐·엘라스틴을 서로 엮는 효소(라이실 옥시데이스)에 필요. 아연과 짝으로 챙깁니다.'},
{k:'e',n:'비타민E',u:'mg',ref:12,W:4,min:16,w:.9,why:'세포막 지질의 산화를 막는 지용성 항산화제. 비타민C가 재생시켜 줘서 둘이 짝입니다.'},
{k:'vk',n:'비타민K',u:'μg',ref:75,W:4,min:300,w:.6,why:'혈액 응고 단백질과 혈관벽 석회화를 막는 단백질에 필요. 와파린 복용 중이면 양을 일정하게 유지하세요.'},
{k:'o3',n:'오메가3 (EPA·DHA)',u:'g',ref:.5,W:7,min:3.5,w:1.2,why:'DHA는 망막 세포막의 주성분. EPA·DHA는 중성지방을 낮추고 염증을 줄입니다.'},
{k:'d',n:'비타민D',u:'μg',ref:10,W:7,min:25,w:1.1,why:'뼈·근육·면역. 10~3월엔 햇빛으로 거의 만들지 못해 등푸른생선이 특히 중요합니다.'},
{k:'a',n:'비타민A',u:'μg',ref:800,W:7,min:2100,w:.9,why:'어두운 곳의 시각·각막·피부 표피 분화. 간에 저장돼 주 단위로 봅니다.'},
{k:'se',n:'셀레늄',u:'μg',ref:60,W:7,min:350,w:.7,why:'항산화 효소(글루타치온 퍼옥시다제)의 핵심. 몸에 저장돼 주 단위로 봅니다.'}
];
const SOFT=[
{k:'lut',n:'루테인',u:'mg',T:30,why:'황반 색소. 청색광을 걸러 황반을 보호합니다. 연구 용량은 하루 10mg.'},
{k:'lyc',n:'라이코펜',u:'mg',T:40,why:'익힌 토마토로 하루 16mg을 10~12주 먹었을 때 자외선 홍반이 줄었다는 무작위 시험이 있습니다.'},
{k:'col',n:'콜라겐 원료',u:'g',T:12,why:'껍질·힘줄·연골의 글리신·프롤린. 음식으로 먹는 건 원료 공급 수준으로 보는 게 정확합니다.'},
{k:'no3',n:'식이 질산염',u:'mg',T:1000,why:'몸에서 산화질소로 바뀌어 혈관 확장에 관여 — 연구 단계입니다.'}
];
const UL={se:400,zn:35,ret:3000,cu:10,d:100};
const RULE={GAP:11,FAM:5,SGAP:4,SALT:3,GRILL:3,REDG:650,RAW_OFF:[6,7,8,9],KOPT:12};
/* 자주 먹는 것 — 저녁 순서에서 조금 앞에 */
const FAV=['blueb','mango','greek','granola'];
const RED_ING=['beef','galbi','shank','tendon','oxtail','lamb','porkl','belly','porkbone','jok'];
const CAT={F:'등푸른생선',W:'흰살생선',S:'조개·해산물',B:'소고기',L:'양고기',P:'돼지고기',V:'두부·계란·채소'};
const SHOP={sal:'샐러드·포케',gri:'생선구이집',raw:'횟집',eel:'장어집',bbq:'고깃집',soup:'국·탕집',shabu:'샤브·전골',west:'양식·브런치',bossam:'보쌈집',jok:'족발집',sea:'해물찜·탕',hansik:'한식',lamb:'양고기집',yuk:'육회집',don:'덮밥집'};
const UB={3:'어디서나',2:'흔함',1:'지역 따라'};
const ANIMAL=['mack','salm','smsalm','sawara','eel','buri','shad','hair','tuna','saury','atka','whitef','sekk','oyster','mussel','egg','mozz','chicken','chickfry','cheese','milk','icecream'];
const ING={
mack:['고등어','pro:20 o3:2.3 d:7 a:37 e:1.3 se:44 zn:1.1 cu:.12 kal:330 mg:30 fol:11'],
salm:['연어','pro:20 o3:2.1 d:8 a:14 e:3.8 se:24 zn:.4 cu:.05 kal:360 mg:27 fol:26'],

/* 타임라인: {start, L:[], S:[]} — 인덱스 t-start. 비어 있으면 그날 섭취 0 */
function gL(tl,u){return u<tl.start?null:(tl.L[u-tl.start]||null)}
function gS(tl,u){return u<tl.start?null:(tl.S[u-tl.start]||null)}
function gX(tl,u){return u<tl.start||!tl.X?null:(tl.X[u-tl.start]||null)}
function xIn(tl,u,j){const a=gX(tl,u);if(!a)return 0;let s=0;for(const x of a)s+=x.v[j];return s}
function dayItems(tl,u){const o=[],a=gL(tl,u),b=gS(tl,u),c=gX(tl,u);if(a)o.push(a);if(b)o.push(b);if(c)for(const x of c)o.push(x);return o}
function setDay(tl,t,L,S){tl.L[t-tl.start]=L||null;tl.S[t-tl.start]=S||null}
function cut(tl,t){const n=Math.max(0,t-tl.start);return {start:tl.start,L:tl.L.slice(0,n),S:tl.S.slice(0,n),X:tl.X?tl.X.slice(0,n):[]}}

 const rules=['같은 점심 메뉴는 고른 다음 날부터 10일 동안 다시 나오지 않아요.','같은 재료(예: 고등어구이·고등어조림)는 4일 동안 다시 나오지 않아요.','같은 저녁 간식은 3일 동안 다시 나오지 않아요.','국물·짠 양념 메뉴와 직화 구이는 7일에 각각 3번까지 — 국물은 1/3만, 탄 부분은 피하세요.','붉은 고기(소·양·돼지)는 7일에 조리 전 '+RULE.REDG+'g까지 — 세계암연구기금 권고(조리 후 주 350~500g 이하) 안쪽이에요.','6~9월엔 회·육회 등 날것이 자동으로 빠지고, 굴·방어·과메기 등은 제철에만 나와요.','닭·오리, 가공육, 공기밥·면·사리·빵, 단 양념, 배달 김치는 메뉴에서 뺐어요.','자주 드시는 블루베리·망고·그릭요거트·그래놀라가 들어간 저녁은 같은 조건이면 조금 앞에 둬요. 블루베리·망고는 비타민C가 적어서, 점심에 채소가 적은 날엔 키위·골드키위를 곁들인 조합이 후보로 나와요.','메뉴에 없는 걸 먹었으면 「메뉴에 없는 걸 먹었어요」로 기록하세요. 일반 메뉴 50가지에서 찾거나, 없으면 이름을 쓰고 가까운 유형을 고르면 추정치로 계산해요. 점심·저녁 말고 따로 먹은 것도 더할 수 있어요.','기록하지 않은 날은 섭취 0으로 계산해요. 먹었다면 그날을 눌러 기록하세요.'];
 h+=`<section class='sec'><h2>메뉴 규칙</h2><div class='card'>${rules.map(x=>`<div class='row'><div class='mn t'>${esc(x)}</div></div>`).join('')}</div></section>`;
 const care=['자외선차단제가 피부 노화 예방의 1순위 — 라이코펜·오메가3는 보조예요.','비타민D는 10~3월엔 식사만으론 부족하기 쉬워요. 혈중 농도 검사 후 보충을 고려하세요.','아연 보충제를 고용량으로 오래 먹으면 구리 결핍 위험이 있어요. 음식은 괜찮아요.','와파린을 먹는다면 녹즙·잎채소·청국장(비타민K) 양을 일정하게 유지하세요.','자몽은 일부 고지혈증약·혈압약과 상호작용해요.','브라질너트는 하루 2알 이하(셀레늄 과잉).','그릭요거트는 무가당 플레인, 그래놀라는 100g당 당류 5g 이하 저당 제품으로 고르세요. 토핑이 들어간 요거트는 플레인보다 당류가 2~3배예요.','신장 질환·통풍이 있거나 복용약이 있으면 담당 의사와 먼저 상의하세요.'];
 h+=`<section class='sec'><h2>꼭 알아둘 것</h2><div class='card'>${care.map(x=>`<div class='row'><div class='mn t'>${esc(x)}</div></div>`).join('')}</div><p class='hint'>모든 성분은 일반 1인분 기준 추정치예요. 참고: 한국인 영양소 섭취기준(2020), 국가표준식품성분표, USDA FoodData Central, 일본식품표준성분표(2020), WCRF/AICR 붉은 고기 권고, Stahl 2001·Rizwan 2011 토마토 광보호 시험, AREDS2, 경구 콜라겐 메타분석(2023~2025).</p></section>`;
 h+=`<section class='sec'><div class='card'><div class='row'><div class='mn'><div class='nm'>기록 모두 지우기</div><div class='sb'>시작일과 고른 기록을 모두 지우고 오늘부터 다시 시작해요</div></div><button class='btn sm danger' data-act='reset'>지우기</button></div></div></section>`;
 return h}
function showModal(t,s,b,f){$('#mt').textContent=t;$('#ms').textContent=s;$('#mb').innerHTML=b;$('#mf').innerHTML=f;$('#ov').classList.add('on');document.body.style.overflow='hidden';$('#mb').scrollTop=0}
function closeModal(){$('#ov').classList.remove('on');document.body.style.overflow=''}
function openItem(kind,id){
 const t=SEL,v=dayView(t),it=kind==='L'?LUNI[id]:SNI[id];if(!it)return;
 const can=t<=TODAY&&t>=START,need=kind==='L'?lunchNeed(v):snackNeed(v,v.fL||v.L);
 const inList=kind==='L'?v.lc.cards.some(c=>c.L===it):v.sc.cards.some(c=>c.S===it),picked=kind==='L'?v.fL===it:v.fS===it;
 let b='';
 if(kind==='L'){
  b+=`<h4>주문</h4><div class='card'><div class='row'><div class='mn'><div class='sb'>배달앱 검색어</div><div class='nm'>${esc(it.kw)}</div></div><button class='btn sm' data-copy='${esc(it.kw)}'>복사</button></div>`+(it.req?`<div class='row'><div class='mn'><div class='sb'>요청사항</div><div class='t'>${esc(it.req)}</div></div><button class='btn sm' data-copy='${esc(it.req)}'>복사</button></div>`:'')+`<div class='row'><div class='mn'><div class='sb'>주문 팁</div><div class='t'>${esc(it.tip)}</div></div></div>`+(it.org?`<div class='row'><div class='mn'><div class='sb'>원산지</div><div class='t'>${esc(it.org)}</div></div></div>`:'')+`</div>`;
  const fl=[it.salt?'국물·짠 양념 — 국물은 1/3만':'',it.grill?'직화 구이 — 탄 부분은 피하기':'',it.raw?'날것 — 6~9월엔 자동 제외':'',it.redg?'붉은 고기 '+it.redg+'g':''].filter(Boolean);
  if(fl.length)b+=`<p class='hint'>${esc(fl.join(' · '))}</p>`;
 }else{b+=`<h4>장보기</h4><div class='cps'>${it.buy.map(x=>`<span class='cp'>${esc(x)}</span>`).join('')}</div>`+(it.note?`<p class='hint'>${esc(it.note)}</p>`:'')}
 const rows=[];for(let j=0;j<NH;j++)if(it.v[j]>0)rows.push(j);rows.sort((a,c)=>it.v[c]/HREF[c]-it.v[a]/HREF[a]);
 b+=`<h4>${kind==='L'?'이 한 끼':'이 간식'}에 든 양<span>하루 기준 대비</span></h4><div class='card'>`+rows.map(j=>{const p=Math.round(it.v[j]/HREF[j]*100),nd=need[j]>0&&it.v[j]>=.25*need[j];return `<div class='nt'><span>${HARD[j].n}${nd?` <i class='cp bl'>지금 필요</i>`:''}</span><span class='a'>${fmt(j,it.v[j])}</span><span class='bar'><b style='width:${Math.min(100,p)}%'></b></span><span class='p'>${pctTxt(p)}</span></div>`}).join('')+`</div>`;
 const soft=SOFT.map((s,i)=>{const x=it.v[SI[i]];return x>0?s.n+' '+num(x)+s.u:''}).filter(Boolean);if(it.poly)soft.push('폴리페놀(마늘·양파·올리브유 등)');
 if(soft.length)b+=`<p class='hint'>그 밖에 ${esc(soft.join(' · '))}</p>`;
 b+=`<h4>구성</h4><p class='t'>${it.parts.map(x=>esc(x.n)+' '+x.g+'g').join(' · ')}</p><p class='hint'>일반 1인분 기준 추정치예요.</p>`;
 let f='';if(can){if(picked)f=`<button class='btn' data-unpick='${kind==='L'?'l':'s'}'>고른 것 취소</button>`;else if(inList)f=`<button class='btn pri' data-pick='${kind}:${it.id}'>${kind==='L'?'점심으로':'저녁으로'} 고르기</button>`}
 showModal(it.name,kind==='L'?SHOP[it.shop]+' · '+UB[it.ub]+' · '+CAT[it.cat]:'저녁 · 가볍게',b,f)}
let TT;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>el.classList.remove('on'),2200)}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast('복사했어요')}catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사했어요')}catch(_){toast('복사하지 못했어요')}ta.remove()}}
function doPick(kind,id){const t=SEL;if(t>TODAY||t<START)return;const k=dstr(t),p=Object.assign({},STO.picks[k]||{});let msg='';
 if(kind==='L'){p.l=id;delete p.lq;delete p.ln;if(p.s&&!custOf(p,'s')){const tl0=cut(BASE,t);if(BASE.X[t-START])tl0.X[t-START]=BASE.X[t-START];const sc=snackCards(tl0,t,LUNI[id]);if(!sc.cards.some(c=>c.S.id===p.s)){delete p.s;msg='점심이 바뀌어 저녁은 다시 골라 주세요'}}}else{p.s=id;delete p.sq;delete p.sn}
 STO.picks[k]=p;save();rebuild();ALT={L:false,S:false};closeModal();render(false);
 toast(msg||(kind==='L'?'점심을 골랐어요 · 저녁과 내일을 다시 맞췄어요':'저녁을 골랐어요 · 내일을 다시 맞췄어요'));
 if(kind==='L'){const s=$('#snk');if(s)setTimeout(()=>s.scrollIntoView({behavior:'smooth',block:'start'}),60)}}
function doUnpick(w){const k=dstr(SEL),p=Object.assign({},STO.picks[k]||{});delete p[w];delete p[w+'q'];delete p[w+'n'];if(!p.l&&!p.s&&!(p.x&&p.x.length))delete STO.picks[k];else STO.picks[k]=p;save();rebuild();closeModal();render(false);toast('선택을 취소했어요')}
function act(a){
 if(a==='reset'){if(!confirm('기록을 모두 지우고 오늘부터 다시 시작할까요?'))return;STO={start:dstr(todayN()),picks:{}};save();initDates();rebuild();SEL=TODAY;TAB='today';render(true);toast('새로 시작했어요');return}
 if(a==='backup'){copy(JSON.stringify(STO));return}
 if(a==='restore'){const s=prompt('복사해 둔 백업을 붙여넣으세요');if(!s)return;try{const o=JSON.parse(s);if(!o||typeof o.picks!=='object'||!o.start)throw 0;STO={start:o.start,picks:o.picks};save();initDates();rebuild();render(true);toast('기록을 불러왔어요')}catch(e){toast('백업 형식이 맞지 않아요')}}}
function render(top){
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
 const m=$('#main');
 if(TAB==='today'){if(SEL>=START&&!VC[SEL]){m.innerHTML=head(SEL)+`<div class='empty' style='margin-top:24px'>계산하고 있어요…</div>`;if(top)scrollTo(0,0);setTimeout(()=>{dayView(SEL);render(false)},30);return}m.innerHTML=renderToday()}
 else if(TAB==='log')m.innerHTML=renderLog();else m.innerHTML=renderGuide();
 if(top)scrollTo(0,0)}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-custom],[data-cpick],[data-cq],[data-xdel],[data-tab],[data-day],[data-nav],[data-open],[data-pick],[data-unpick],[data-copy],[data-alt],[data-act],[data-close]');if(!el)return;const d=el.dataset;
 if('close' in d){if(el.id!=='ov'||e.target===el)closeModal();return}
 if('copy' in d){copy(d.copy);return}
 if('custom' in d){openCustom(d.custom);return}
 if('cpick' in d){doCustomPick(d.cpick);return}
 if('cq' in d){CU.q=+d.cq;drawCustom();return}
 if('xdel' in d){delExtra(d.xdel);return}
 if('tab' in d){TAB=d.tab;render(true);return}
 if('day' in d){if(el.disabled)return;SEL=+d.day;TAB='today';ALT={L:false,S:false};render(true);return}
 if('nav' in d){const n=+d.nav;SEL=n===0?TODAY:Math.min(TODAY+MAXF,SEL+n);ALT={L:false,S:false};render(true);return}
 if('open' in d){const q=d.open.split(':');openItem(q[0],q[1]);return}
 if('pick' in d){const q=d.pick.split(':');doPick(q[0],q[1]);return}
 if('unpick' in d){doUnpick(d.unpick);return}
 if('alt' in d){ALT[d.alt]=!ALT[d.alt];render(false);return}
 if('act' in d){act(d.act)}});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='cq'){CU.query=e.target.value;drawCustom()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if($('#ov').classList.contains('on')||TAB!=='today'||e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft'){SEL--;ALT={L:false,S:false};render(true)}if(e.key==='ArrowRight'&&SEL<TODAY+MAXF){SEL++;ALT={L:false,S:false};render(true)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const n=todayN();if(n!==TODAY){const was=SEL===TODAY;initDates();rebuild();if(was)SEL=TODAY;render(false)}});
load();initDates();SEL=TODAY;rebuild();render(true);
</script>
